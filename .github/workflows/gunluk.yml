name: Günlük veri ve tahmin

on:
  schedule:
    - cron: "17 5 * * *"     # her gün 05:17 UTC = 08:17 Türkiye saati
    - cron: "43 14 * * *"    # her gün 14:43 UTC = 17:43 Türkiye saati (maç öncesi güncel oranlar için)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write             # sonuçları depoya geri kaydedebilmek için

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: football-data.co.uk verilerini indir
        run: python scripts/veri_indir.py

      - name: API-Football oranlarını çek (anahtar tanımlıysa)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python scripts/api_football_veri.py oranlar
        continue-on-error: true

      - name: Tahminleri üret
        run: python scripts/tahmin.py

      - name: Geçmiş tahminleri değerlendir
        run: python scripts/degerlendir.py

      - name: Sonuçları depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Otomatik güncelleme: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
